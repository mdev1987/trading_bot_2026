version = 1

# Memecoin paper-trading bot — Bun TypeScript (Modules 1-13).
# Pipeline: DexPaprika discovery/OHLCV -> market structure -> setup/entry
#   -> Jupiter paper quotes (no transactions) -> PaperAccount virtual wallet
#   -> Telegram BUY/PARTIAL/CLOSE reports + lowdb state + DuckDB ledger.
# See README.md for methodology. Keys come from .env (gitignored, never commit).
# Apply with: oxmgr apply ./oxfile.toml   (from this directory)
# Logs with:  oxmgr logs memecoin-paper-bot -f

[[apps]]
name = "memecoin-paper-bot"
# Bun runtime: loads .env automatically and runs TypeScript directly,
# matching `bun run paper-live` in package.json. Absolute bun path so
# the daemon does not depend on interactive-shell PATH.
command = "/usr/bin/bun run paper-live"
cwd = "/home/mdev/Programming/trading_bot_2026"
restart_policy = "always"
max_restarts = 100
# Stop after 5 crash-restarts inside 5 minutes: a persistent config error
# (e.g. missing .env keys, exit code != 0) must error-state, not hot-loop.
# 0 would disable this protection entirely.
crash_restart_limit = 5
restart_delay_secs = 10
stop_signal = "SIGTERM"
stop_timeout_secs = 20
# Liveness: the loop logs one line per closed 15m candle plus state.json
# rewrites on every processed candle. Either going stale (>30 min)
# means wedged on I/O. Manual check:
#   ./scripts/ox-health.sh; echo $?
# No health_cmd is set because oxmgr 0.5.0's health executor is broken
# server-side: even health_cmd="/usr/bin/true" reports
# "No such file or directory (os error 2)". A permanently-unhealthy flag
# risks restart churn, so health checking stays out until oxmgr fixes it.
# Crash protection still applies via crash_restart_limit above.
# No pre_reload_cmd for the same executor reason (it would fail every
# reload). Sync deps manually before apply/reload:
#   bun install --frozen-lockfile
unified_logs = true

[apps.env]
PATH = "/home/mdev/.bun/bin:/home/mdev/.cargo/bin:/usr/local/bin:/home/mdev/.local/bin:/usr/bin:/bin"
HOME = "/home/mdev"
